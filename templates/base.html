{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}DigiKala Replica{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar">

        <!-- Logo -->
        <div class="navbar-brand">
            <a href="{% url 'home' %}">
                DigiKala
            </a>
        </div>

        <!-- Navigation links -->
        <div class="navbar-links">

            <a href="">
                All Stores
            </a>

            <a href="">
                All Products
            </a>

            <a href="">
                About Us
            </a>

            {% if user.is_authenticated %}

                <a href="">
                    My Profile
                </a>

                <a href="">
                    My Cart
                </a>

                <form action="" method="post">
                    {% csrf_token %}
                    <button type="submit">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="">
                    Login
                </a>

            {% endif %}

        </div>

    </nav>



    <main>

        {% block content %}
        {% endblock %}

    </main>



    <footer>
        <p>&copy; {% now "Y" %} DigiKala Replica</p>
    </footer>

</body>
</html>
