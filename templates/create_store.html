{% extends 'base.html' %}
{% block title %}Create store | DijiKala{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">🏪 ساخت فروشگاه جدید</h2>

    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="form-group">
            <label for="{{ form.name.id_for_label }}">نام فروشگاه</label>
            {{ form.name }}
            {{ form.name.errors }}
        </div>

        <div class="form-group">
            <label for="{{ form.description.id_for_label }}">توضیحات فروشگاه</label>
            {{ form.description }}
            {{ form.description.errors }}
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">ثبت و ایجاد فروشگاه</button>
        </div>
    </form>
</div>
{% endblock %}
